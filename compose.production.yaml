name: technotes-production

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [sandbox]

  postgres-exec:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: technotes_admin
      POSTGRES_PASSWORD: ${SQL_EXEC_POSTGRES_ADMIN_PASSWORD:?Set SQL_EXEC_POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres-exec-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technotes_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [sandbox]

  piston:
    build:
      context: ./execution/piston
      dockerfile: Dockerfile
    image: technotes-piston:production
    restart: unless-stopped
    # Piston runs untrusted code and requires elevated privileges.
    # Isolate this service on a dedicated host/network in production.
    privileged: true
    environment:
      PISTON_OUTPUT_MAX_SIZE: ${PISTON_OUTPUT_MAX_SIZE:-65536}
      PISTON_COMPILE_MEMORY_LIMIT: ${PISTON_COMPILE_MEMORY_LIMIT:-3221225472}
      PISTON_RUN_MEMORY_LIMIT: ${PISTON_RUN_MEMORY_LIMIT:-1073741824}
      PISTON_COMPILE_TIMEOUT: ${PISTON_COMPILE_TIMEOUT:-20000}
      PISTON_RUN_TIMEOUT: ${PISTON_RUN_TIMEOUT:-10000}

  piston-bootstrap:
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      piston:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fsS http://piston:2000/api/v2/runtimes >/dev/null; do sleep 2; done
        runtimes=$$(curl -fsS http://piston:2000/api/v2/runtimes)
        install_package() {
          package="$$1"
          language="$$2"
          if echo "$$runtimes" | grep -q "\"language\":\"$$language\""; then return; fi
          curl -fsS -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d "$$package" >/dev/null || exit 1
        }
        install_package '{"language":"node","version":"20.11.1"}' javascript
        install_package '{"language":"bash","version":"5.2.0"}' bash
        install_package '{"language":"sqlite3","version":"3.36.0"}' sqlite3
        runtimes=$$(curl -fsS http://piston:2000/api/v2/runtimes)
        for language in javascript bash sqlite3; do
          echo "$$runtimes" | grep -q "\"language\":\"$$language\"" || exit 1
        done

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: technotes-api:production
    restart: unless-stopped
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080

      # Neon is the main application database.
      ConnectionStrings__DefaultConnection: ${NEON_CONNECTION_STRING:?Set NEON_CONNECTION_STRING}

      # Configure your ASP.NET CORS policy to read Cors:AllowedOrigins.
      Cors__AllowedOrigins__0: ${FRONTEND_URL:?Set FRONTEND_URL}

      Execution__PistonBaseUrl: http://piston:2000
      Execution__RateLimitPermitLimit: ${EXECUTION_RATE_LIMIT_PERMIT_LIMIT:-60}
      Execution__SqlServerAdminConnectionString: Server=sqlserver,1433;Database=master;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Execution__SqlServerSandboxConnectionString: Server=sqlserver,1433;Database=master;User Id=technotes_sandbox;Password=${SQLSERVER_SANDBOX_PASSWORD:?Set SQLSERVER_SANDBOX_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Execution__PostgresAdminConnectionString: Host=postgres-exec;Port=5432;Database=postgres;Username=technotes_admin;Password=${SQL_EXEC_POSTGRES_ADMIN_PASSWORD:?Set SQL_EXEC_POSTGRES_ADMIN_PASSWORD}
      Execution__PostgresSandboxConnectionString: Host=postgres-exec;Port=5432;Database=postgres;Username=technotes_sandbox;Password=${SQL_EXEC_POSTGRES_SANDBOX_PASSWORD:?Set SQL_EXEC_POSTGRES_SANDBOX_PASSWORD}

      Jwt__Issuer: ${JWT_ISSUER:-TechNotes.API}
      Jwt__Audience: ${JWT_AUDIENCE:-TechNotes.Client}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      AdminSeed__Email: ${ADMIN_EMAIL:-admin@example.com}
      AdminSeed__UserName: ${ADMIN_USERNAME:-admin}
      AdminSeed__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}

      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET}
      Cloudinary__Folder: ${CLOUDINARY_FOLDER:-technotes}

      HttpsRedirection__Enabled: "false"
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-true}
      Database__SeedOnStartup: ${SEED_ON_STARTUP:-true}
    depends_on:
      sqlserver:
        condition: service_healthy
      postgres-exec:
        condition: service_healthy
      piston-bootstrap:
        condition: service_completed_successfully
    networks:
      - default
      - sandbox

volumes:
  sqlserver-data:
  postgres-exec-data:

networks:
  sandbox:
    internal: true
